<div class="dashboard-container" [class.is-mobile]="mobileQuery.matches">

  <!-- Implementar meu toolbar -->
    <mat-toolbar color="primary" class="dashboard-toolbar">
      <button mat-icon-button (click)="snav.toggle()"><mat-icon>menu</mat-icon></button>
      <h1 class="app-name">My App Iventario</h1>

      <div class="right">
        <ul>
          <li>
            <button mat-icon-button>
              <mat-icon color="warn">help_outline</mat-icon>
            </button>
          </li>
          <li>
            <button mat-button [matMenuTriggerFor]="menu">
              <mat-icon color="primary">person_outline</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
            <mat-icon>exit_to_app</mat-icon>
            Encerrar Sessão
            </mat-menu>
          </li>
        
        </ul>
      </div>

    </mat-toolbar>

    <!-- implementar sidenav -->

    <mat-sidenav-container class="sidenav-container"
                            [style.marginLeft]="mobileQuery.matches ? 56 : 0">
              <mat-sidenav #snav [mode]="mobileQuery.matches ? 'over' : 'side'" 
                            [fixedInViewport]="mobileQuery.matches" fixedTopGap="56">

                <mat-nav-list>
                  <!-- profile -->
                   <div class="profile-card">
                    <div class="header">
                         <h2>Adson Sá</h2>
                         <h4>adson@exemplo.com</h4>
                    </div>
                   </div>

                   <mat-divider></mat-divider>

                   <a mat-list-item [routerLink]="nav.route" *ngFor="let nav of menuNav">
                    <mat-icon class="icono">{{nav.icon}}</mat-icon>
                    {{nav.name}}

                   </a>

                </mat-nav-list>
              </mat-sidenav>

              <mat-sidenav-container>
                <router-outlet></router-outlet>
              </mat-sidenav-container>

    </mat-sidenav-container>

  
</div>
